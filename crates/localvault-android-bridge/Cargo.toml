[package]
name = "localvault-android-bridge"
version = "0.1.0"
edition = "2021"
description = "Android FFI adapter: exposes localvault-core's vault open/mutate/save operations to Kotlin via stable UniFFI/JNA bindings. Thin marshalling layer only -- crypto, format and schema logic stay in localvault-core."
authors = ["Штраус Никита Алексеевич"]
publish = false

[lib]
name = "localvault_android_bridge"
crate-type = ["cdylib", "lib"]

[dependencies]
localvault-core = { path = "../localvault-core" }
uniffi = "=0.32.0"
serde_json = "1"
thiserror = "2"
zeroize = "1.9.0"
# Same pinned version already used by localvault-core and src-tauri (not a new
# or unaudited dependency). Needed here to parse the category_id string a
# mutation input carries across FFI into the Option<Uuid> localvault-core's
# VaultEntry requires -- otherwise the bridge would have to do that parsing
# by hand instead of reusing the crate core's own data model already depends on.
uuid = "1.26.0"

[dev-dependencies]
sha2 = "0.10"

[features]
# Host-only: generates Kotlin bindings via `uniffi-bindgen`. Kept out of the
# cdylib shipped to Android so CLI tooling (clap, camino, uniffi_bindgen)
# never links into the runtime library.
bindgen = ["uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi_bindgen.rs"
required-features = ["bindgen"]
