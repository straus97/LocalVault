[package]
name = "localvault-core"
version = "0.1.0"
edition = "2021"
description = "Portable LocalVault security and vault-domain core: crypto, vault format, data model, and TOTP"
authors = ["Штраус Никита Алексеевич"]
publish = false

[lib]
name = "localvault_core"

[dependencies]
argon2 = { version = "0.6.0", features = ["zeroize"] }
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
getrandom = "0.4.3"
zeroize = "1.9.0"
serde = { version = "1", features = ["derive"] }
thiserror = "2.0.20"
base64 = "0.23.1"
uuid = { version = "1.26.0", features = ["v4", "serde"] }
data-encoding = "2"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
url = "2"

[dev-dependencies]
serde_json = "1"
