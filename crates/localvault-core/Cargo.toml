[package]
name = "localvault-core"
version = "0.1.0"
edition = "2021"
description = "Reusable LocalVault core (skeleton — no logic yet)"
authors = ["Штраус Никита Алексеевич"]
publish = false

[lib]
name = "localvault_core"

[dependencies]
argon2 = { version = "0.6.0", features = ["zeroize"] }
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
getrandom = "0.4.3"
zeroize = "1.9.0"
serde = { version = "1", features = ["derive"] }
thiserror = "2.0.20"

[dev-dependencies]
serde_json = "1"
