[package]
name = "localvault"
version = "0.1.0"
description = "Local encrypted password manager"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "localvault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = { version = "0.6.0", features = ["zeroize"] }
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
getrandom = "0.4.3"
base64 = "0.23.1"
zeroize = "1.9.0"
thiserror = "2.0.20"
atomic-write-file = "0.3.1"
uuid = { version = "1.26.0", features = ["v4", "serde"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[target.'cfg(windows)'.dependencies]
clipboard-win = "=5.4.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
