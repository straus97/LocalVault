[package]
name = "localvault"
version = "1.0.0"
description = "Local encrypted password manager"
authors = ["Штраус Никита Алексеевич"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "localvault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
localvault-core = { path = "../crates/localvault-core" }
getrandom = "0.4.3"
base64 = "0.23.1"
data-encoding = "2"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
zeroize = "1.9.0"
thiserror = "2.0.20"
atomic-write-file = "0.3.1"
uuid = { version = "1.26.0", features = ["v4", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tokio = { version = "1", features = ["net"] }
url = "2"
scraper = "0.24"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "ico", "webp"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[target.'cfg(windows)'.dependencies]
clipboard-win = "=5.4.1"

# [profile.release] moved to the workspace root Cargo.toml — Cargo only
# honors profile tables from the workspace root, not member manifests.

[dev-dependencies]
tempfile = "3.27.0"
